        - generic [ref=e20]: About Us
        - heading "Modern Construction Specialists" [level=1] [ref=e22]:
          - generic [ref=e24]: Modern
          - generic [ref=e26]: Construction
          - generic [ref=e28]: Specialists
        - paragraph [ref=e30]: One of Ireland's most trusted building and civil engineering firms — our story is one of steady growth, enduring partnerships, and a commitment to quality.
      - generic [ref=e32]:
        - generic [ref=e33]:
          - generic [ref=e36]: Est. 2004
          - heading "Our Story" [level=2] [ref=e37]
        - paragraph [ref=e39]: Ganson is one of Ireland and the UK's most progressive building contractors, delivering large-scale and complex projects across both jurisdictions.
        - generic [ref=e41]:
          - paragraph [ref=e43]: We operate as a leading contractor across a wide range of public and private sector developments, with a proven track record of quality delivery, programme certainty and strong client relationships.
          - paragraph [ref=e45]: "Founded in 2004 by Paul McQuaid and David Rogers, both Civil Engineering graduates of Queen's University Belfast, Ganson was built on a singular vision: to redefine industry standards through technical excellence and genuine partnership. What began as a small contracting firm has evolved into a premier full-service main contractor, delivering complex projects across multiple sectors in Ireland and the UK."
          - paragraph [ref=e47]: Operating from a strategic hub in Dublin and in London, allowing us to serve Ireland and the UK, we provide an agile, multidisciplinary response to the complexities of the modern built environment. Whether through Traditional, Design & Build, or Management Contracting models, our approach is tailored to the unique demands of every project.
          - paragraph [ref=e49]: Our commitment to the “Ganson Standard” offers our clients the ultimate assurance of financial stability, operational precision and integrity.
      - generic [ref=e51]:
        - generic [ref=e52]:
          - generic [ref=e55]: Leadership
          - heading "Our Founders" [level=2] [ref=e56]
        - generic [ref=e57]:
          - generic [ref=e59]:
            - img "Paul McQuaid" [ref=e61]
            - generic [ref=e62]:
              - heading "Paul McQuaid" [level=3] [ref=e63]
              - paragraph [ref=e64]: Co-Founder
              - paragraph [ref=e65]: Paul McQuaid is a Co-founder of Ganson and has been instrumental in the development and expansion of the business over the past decades. Having graduated as a Civil Engineer in 1987 from Queen's University Belfast, Paul has accumulated more than 30 years' experience delivering complex building and civil engineering projects across multiple sectors. He applies this deep technical understanding and industry insight to support the Group's financial strength, strategic planning, and long-term decision-making.
          - generic [ref=e68]:
            - img "David Rogers" [ref=e70]
            - generic [ref=e71]:
              - heading "David Rogers" [level=3] [ref=e72]
              - paragraph [ref=e73]: Co-Founder
              - paragraph [ref=e74]: David Rogers is a Co-founder of Ganson and a key leader in the delivery of operational excellence across the business. Since graduating as a Civil Engineer from Queen's University Belfast in 1987, David has developed a wealth of experience in the construction and civil engineering sector. A Chartered Engineer, he has been instrumental in growing the company into a leading contractor and is responsible for overseeing operations, driving performance, and ensuring that Ganson consistently delivers high-quality projects safely, efficiently and to the highest professional standards.
