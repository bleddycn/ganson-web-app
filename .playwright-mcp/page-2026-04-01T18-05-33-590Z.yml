      - generic [ref=e117]:
        - heading "Our Approach" [level=2] [ref=e119]
        - generic [ref=e120]:
          - generic [ref=e122]:
            - generic [ref=e123]: "01"
            - heading "Safety" [level=3] [ref=e125]
            - paragraph [ref=e127]: We are committed to a zero-harm culture on every site we operate. Our ISO 45001 certified health and safety management system, combined with rigorous training and leadership from the boardroom to the site, has delivered an industry-leading safety record. Every person on a Ganson site goes home safe, every day.
          - generic [ref=e129]:
            - generic [ref=e130]: "02"
            - heading "Quality" [level=3] [ref=e132]
            - paragraph [ref=e134]: Our ISO 9001 certified quality management system underpins everything we do. We apply Total Quality Management principles across every project, from pre-construction planning through to handover, ensuring consistent delivery to the highest standards. Quality is not an afterthought — it is embedded in our culture.
          - generic [ref=e136]:
            - generic [ref=e137]: "03"
            - heading "Sustainability" [level=3] [ref=e139]
            - paragraph [ref=e141]: Environmental responsibility is central to how we build. Our ISO 14001 certified environmental management system drives continuous improvement in resource efficiency, waste reduction, and carbon footprint management. We work with clients and design teams to deliver buildings that perform for generations.
      - generic [ref=e143]:
        - generic [ref=e144]:
          - generic [ref=e147]: Partnership
          - heading "Ganson & Errigal Group" [level=2] [ref=e148]
        - paragraph [ref=e150]: Ganson's partnership with Errigal strengthens our ability to deliver exceptional results for clients across every project. By combining Ganson's expertise and local knowledge with Errigal's scale, experience, and resources, the partnership creates a powerful foundation built on shared values of quality, reliability, and innovation. Together, we bring greater capability, stability, and opportunity to every project, ensuring our clients benefit from the strength of a trusted and collaborative relationship.
