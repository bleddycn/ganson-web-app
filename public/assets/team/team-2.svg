<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <!--
    Ganson Team Placeholder 2
    Placeholder for team member headshot photography.
  -->

  <!-- Background -->
  <rect width="400" height="500" fill="#ddd8cf"/>

  <!-- Avatar silhouette - head -->
  <circle cx="200" cy="190" r="70" fill="#bbb6ad"/>

  <!-- Avatar silhouette - shoulders/body -->
  <ellipse cx="200" cy="400" rx="120" ry="130" fill="#bbb6ad"/>

  <!-- Team number -->
  <text
    x="200"
    y="195"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
    font-weight="500"
    font-size="36"
    fill="#ddd8cf"
    opacity="0.6"
  >2</text>

  <!-- Subtle bottom label -->
  <text
    x="200"
    y="475"
    text-anchor="middle"
    font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
    font-weight="400"
    font-size="11"
    letter-spacing="4"
    fill="#4a4a4a"
    opacity="0.3"
  >TEAM MEMBER</text>
</svg>