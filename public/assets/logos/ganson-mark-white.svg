<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none">
  <!--
    Ganson Building & Civil Engineering - Triangle Mark (White variant)
    White triangle with transparent staircase cuts for use on dark backgrounds.
  -->
  <defs>
    <mask id="staircase-mask">
      <polygon points="88,2 0,98 200,98" fill="white"/>
      <rect x="-5" y="22" width="78" height="14" fill="black"/>
      <rect x="-5" y="47" width="102" height="14" fill="black"/>
      <rect x="-5" y="72" width="126" height="14" fill="black"/>
    </mask>
  </defs>
  <rect x="0" y="0" width="200" height="100" fill="#ffffff" mask="url(#staircase-mask)"/>
</svg>
