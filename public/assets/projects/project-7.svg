<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <!--
    Ganson Project Placeholder 7
    Placeholder image for project photography.
  -->

  <!-- Background -->
  <rect width="1200" height="800" fill="#2e2e2e"/>
  
    <!-- Subtle grid pattern -->
    <defs>
      <pattern id="grid-7" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#d00918" stroke-width="0.5" opacity="0.15"/>
      </pattern>
    </defs>
    <rect width="1200" height="800" fill="url(#grid-7)"/>
    <!-- Diagonal accent line -->
    <line x1="0" y1="800" x2="800" y2="0" stroke="#d00918" stroke-width="2" opacity="0.3"/>
    <line x1="400" y1="800" x2="1200" y2="0" stroke="#d00918" stroke-width="2" opacity="0.3"/>
    <!-- Construction beam shapes -->
    <rect x="100" y="300" width="400" height="8" fill="#d00918" opacity="0.2" transform="rotate(-15 100 300)"/>
    <rect x="700" y="200" width="350" height="8" fill="#d00918" opacity="0.2" transform="rotate(10 700 200)"/>

  <!-- Project number -->
  <text
    x="600"
    y="380"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-weight="700"
    font-size="180"
    fill="white"
    opacity="0.08"
  >07</text>

  <!-- Label text -->
  <text
    x="600"
    y="480"
    text-anchor="middle"
    font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
    font-weight="400"
    font-size="18"
    letter-spacing="6"
    fill="#d00918"
    opacity="0.5"
  >PROJECT PHOTOGRAPHY</text>

  <!-- Small accent line -->
  <line x1="540" y1="500" x2="660" y2="500" stroke="#d00918" stroke-width="1" opacity="0.4"/>
</svg>