<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <!--
    Ganson Project Placeholder 8
    Placeholder image for project photography.
  -->

  <!-- Background -->
  <rect width="1200" height="800" fill="#1a2d5a"/>
  
    <!-- Blueprint grid -->
    <defs>
      <pattern id="blueprint-8" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="none" stroke="#e6e1d8" stroke-width="0.3" opacity="0.12"/>
      </pattern>
    </defs>
    <rect width="1200" height="800" fill="url(#blueprint-8)"/>
    <!-- Building outline shapes -->
    <rect x="150" y="200" width="300" height="400" fill="none" stroke="#e6e1d8" stroke-width="1.5" opacity="0.2"/>
    <rect x="500" y="150" width="250" height="450" fill="none" stroke="#e6e1d8" stroke-width="1.5" opacity="0.2"/>
    <rect x="800" y="250" width="200" height="350" fill="none" stroke="#e6e1d8" stroke-width="1.5" opacity="0.2"/>
    <!-- Cross bracing -->
    <line x1="150" y1="200" x2="450" y2="600" stroke="#e6e1d8" stroke-width="0.8" opacity="0.15"/>
    <line x1="450" y1="200" x2="150" y2="600" stroke="#e6e1d8" stroke-width="0.8" opacity="0.15"/>

  <!-- Project number -->
  <text
    x="600"
    y="380"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Playfair Display', Georgia, serif"
    font-weight="700"
    font-size="180"
    fill="white"
    opacity="0.08"
  >08</text>

  <!-- Label text -->
  <text
    x="600"
    y="480"
    text-anchor="middle"
    font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif"
    font-weight="400"
    font-size="18"
    letter-spacing="6"
    fill="#e6e1d8"
    opacity="0.5"
  >PROJECT PHOTOGRAPHY</text>

  <!-- Small accent line -->
  <line x1="540" y1="500" x2="660" y2="500" stroke="#e6e1d8" stroke-width="1" opacity="0.4"/>
</svg>